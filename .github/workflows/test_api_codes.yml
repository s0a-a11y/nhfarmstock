name: Test API Codes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run code discovery test
        run: python test_api_codes.py
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
